<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine, Nwadinma?</title>
    <meta name="description" content="A special Valentine's request for Nwadinma">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="hearts-container"></div>

    <div class="container" id="mainContainer">
        <div id="questionSection">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp4bjBvNHBpZnpxbjBvNHBpZnpxbjBvNHBpZnpxbjBvNHBpZnpx&ep=v1_gifs_search&rid=giphy.gif&ct=g"
                alt="Cute Valentine GIF" class="valentine-gif">
            <h1>Nwadinma, Will You Be My Valentine? 🌹</h1>
            <div class="buttons">
                <button class="btn" id="yesBtn">Yes!</button>
            </div>
        </div>

        <div id="celebrationSection" class="celebration">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHp4bjBvNHBpZnpxbjBvNHBpZnpxbjBvNHBpZnpxbjBvNHBpZnpx&ep=v1_gifs_search&rid=giphy.gif&ct=g"
                alt="Happy Celebration GIF" class="valentine-gif">
            <div id="celebrationMessage">YAAAAAAS! I love you, Nwadinma! ❤️❤️</div>
        </div>
    </div>

    <button class="btn" id="noBtn">No</button>

    <script src="script.js"></script>
</body>

</html>
